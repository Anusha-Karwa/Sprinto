# ICP configuration. EVERY number used by the research pipeline lives here (spec §3, §6).
# Change behaviour by editing this file, never by editing code.

fetch:
  cache_days: 7                 # disk cache; --refresh ignores it
  delay_seconds: [2, 4]         # polite random delay per host
  timeout_seconds: 15
  min_visible_words: 200        # below this a 200 page is treated as a possible JS shell
  browser_timeout_seconds: 20
  max_browser_retries_per_page: 1
  accept_language: en

clean:
  max_tokens_per_page: 2000
  min_line_words: 8             # shorter lines dropped unless regex hit / job title / plan / heading
  near_duplicate_ratio: 0.90
  section_priority: [HERO, ABOUT, PRICING, SECURITY, JOBS, FOOTER BADGES, CUSTOMERS, PRODUCT, OTHER]

verify:
  quote_min_words: 5
  quote_max_words: 40
  fuzzy_match_ratio: 0.90       # sliding-window SequenceMatcher threshold

loop:
  max_extra_fetches: 4          # qualify loop: ≤ 4 fetches after the homepage (decided before build)
  max_browser_retries: 1

# Evidence map (spec §6.3). Each question has a per-question fetch limit.
evidence_map:
  Q1_b2b_saas:      {limit: 1, priority: 1, if_unanswered: MANUAL_REVIEW}
  Q2_certified:     {limit: 1, priority: 2, if_unanswered: treat_not_certified_and_flag}
  Q3_stage:         {limit: 2, priority: 3, if_unanswered: qualify_lower_rank_and_flag}
  Q4_pressure:      {limit: 1, priority: 4, if_unanswered: score_zero}

sufficiency:
  Q3_stage:
    min_open_roles: 5
    headcount_range: [20, 500]

short_circuit:
  already_certified_rule: both  # both = SOC 2 AND ISO 27001 claimed → DROP | any = either one
  competitor_trust_center: [vanta, drata, secureframe, sprinto, thoropass, scrut]
  drop_stages: [series d, series e, series f, public, ipo, acquired]
  max_headcount: 1000
  min_headcount: 10

rubric:
  stage:            # max 35
    named_a_to_c: 35
    proxy: 25       # ≥5 open roles or headcount 20–500, no round named
    enterprise_tier_only: 15
    unknown: 0
  pressure:         # max 40
    enterprise_plan_or_sso: 15
    enterprise_or_regulated_customers: 10
    security_page_no_cert_or_in_progress: 10
    security_compliance_hiring: 15
    cap: 40
  expansion_gap: 15 # 0–1 of SOC2/ISO27001 AND selling to EU/US/enterprise
  b2b_clarity: 10

thresholds:
  qualified: 60
  flagged_floor: 40

# Keyword variants. Text and keywords are normalised (case, spaces, hyphens, dots) BEFORE matching
# — L1's "React.js vs React" lesson.
keywords:
  certifications:
    SOC 2: ["soc 2", "soc2", "soc-2", "soc ii", "soc 2 type ii", "soc 2 type 2", "soc 2 type i", "soc 2 type 1"]
    ISO 27001: ["iso 27001", "iso/iec 27001", "iso27001", "iso-27001", "iso 27001:2022", "iso 27001:2013"]
    GDPR: ["gdpr", "gdpr compliant", "gdpr-compliant"]
    HIPAA: ["hipaa", "hipaa compliant", "hipaa-compliant"]
    PCI DSS: ["pci dss", "pci-dss", "pci compliant", "pci"]
  in_progress_phrases: ["in progress", "working towards", "working toward", "underway", "pursuing", "currently undergoing", "coming soon", "expected"]
  trust_center_vendors: [vanta, drata, secureframe, sprinto, thoropass, scrut, safebase, whistic, conveyor]
  funding: ["pre-seed", "seed", "series a", "series b", "series c", "series d", "series e", "series f"]
  enterprise: ["enterprise", "contact sales", "talk to sales", "sso", "saml", "scim", "audit log", "audit logs", "single sign-on", "dedicated support", "sla", "role-based access", "rbac"]
  compliance_roles: ["security", "compliance", "grc", "infosec", "information security", "risk", "privacy", "devsecops", "trust"]
  regulated_industries: ["bank", "banking", "fintech", "healthcare", "health", "hospital", "insurance", "government", "pharma", "payments", "financial services", "lending"]
  regions_eu_us: ["europe", "eu", "united states", "usa", "us", "north america", "uk", "emea", "global"]
